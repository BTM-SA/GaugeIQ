name: Build release package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to rebuild, for example v0.1.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    env:
      RELEASE_TAG: ${{ github.ref_name || inputs.tag }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, openssl, pdo_sqlite, pdo_mysql, zip
          tools: composer

      - name: Set release version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG}"
          SAFE_VERSION="${VERSION#v}"
          cat > app/Version.php <<PHP
<?php
declare(strict_types=1);

final class GaugeIQVersion
{
    public const VERSION = '${SAFE_VERSION}';
}
PHP
          php -l app/Version.php

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Verify production dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -f vendor/autoload.php
          test -d vendor/minishlink/web-push
          php -r "require 'vendor/autoload.php'; if (!class_exists('Minishlink\\WebPush\\WebPush')) exit(1); echo 'Web Push dependencies OK.' . PHP_EOL;"

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG}"
          SAFE_VERSION="${VERSION#v}"
          PACKAGE="GaugeIQ-${SAFE_VERSION}"
          mkdir -p "dist/${PACKAGE}"

          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='config/local.php' \
            --exclude='config/installed.lock' \
            --exclude='storage/*' \
            --exclude='*.log' \
            ./ "dist/${PACKAGE}/"

          rm -rf "dist/${PACKAGE}/storage"
          mkdir -p "dist/${PACKAGE}/storage"
          test -f "dist/${PACKAGE}/vendor/autoload.php"
          test -d "dist/${PACKAGE}/vendor/minishlink/web-push"
          test -f "dist/${PACKAGE}/app/Version.php"

          cd dist
          cp "${PACKAGE}/app/Version.php" "${PACKAGE}.Version.php"
          zip -qr "${PACKAGE}.zip" "${PACKAGE}"
          unzip -t "${PACKAGE}.zip" >/dev/null
          unzip -l "${PACKAGE}.zip" | grep -q "/vendor/autoload.php$"
          sha256sum "${PACKAGE}.zip" > "${PACKAGE}.zip.sha256"
          test -f "${PACKAGE}.Version.php"
          grep -q "VERSION = '${SAFE_VERSION}'" "${PACKAGE}.Version.php"

      - name: Wait for GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          for attempt in {1..30}; do
            if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "Release ${RELEASE_TAG} is available."
              exit 0
            fi
            echo "Waiting for release ${RELEASE_TAG}..."
            sleep 5
          done

          echo "Release ${RELEASE_TAG} was not found."
          exit 1

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION="${RELEASE_TAG}"
          SAFE_VERSION="${VERSION#v}"

          gh release upload "${RELEASE_TAG}" \
            "dist/GaugeIQ-${SAFE_VERSION}.zip" \
            "dist/GaugeIQ-${SAFE_VERSION}.zip.sha256" \
            "dist/GaugeIQ-${SAFE_VERSION}.Version.php" \
            --clobber
